name: Build and publish A2E image

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      site_url:
        description: Public HTTPS origin baked into the image (must match Portainer)
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/lololarue93/a2e-renovation

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=tag

      - name: Build verification image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ inputs.site_url || vars.NEXT_PUBLIC_SITE_URL || 'https://a2e.ddns.net' }}
          load: true
          tags: a2e-web:local
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate deployment and persistence before publishing
        env:
          A2E_SMOKE_TEST: "1"
          A2E_SMOKE_SKIP_BUILD: "1"
        run: bash scripts/docker/smoke.sh

      - name: Publish verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ inputs.site_url || vars.NEXT_PUBLIC_SITE_URL || 'https://a2e.ddns.net' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment reference
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_TAG: sha-${{ github.sha }}
        run: |
          printf 'Production Portainer variable: A2E_IMAGE_TAG=%s\n' "$DEPLOY_TAG" >> "$GITHUB_STEP_SUMMARY"
          printf 'Back up PostgreSQL and media before updating the existing stack.\n' >> "$GITHUB_STEP_SUMMARY"
