name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine3.23
        env:
          POSTGRES_DB: a2e_renovation
          POSTGRES_USER: a2e
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U a2e -d a2e_renovation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://a2e:ci-password@localhost:5432/a2e_renovation?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-password
      AUTH_SECRET: ci-only-secret-change-me
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --force
      - name: Verify dependency versions
        run: pnpm list @prisma/client prisma --depth 0
      - name: Generate Prisma client
        run: pnpm exec prisma generate
      - name: Apply migrations on test database
        run: pnpm exec prisma migrate deploy
      - name: Verify calculations and protected workflows
        run: |
          pnpm exec tsx scripts/verify-estimates.ts
          pnpm exec tsx scripts/verify-estimator-flow.ts
          pnpm exec tsx scripts/verify-detailed-pricing.ts
          pnpm exec tsx scripts/verify-bootstrap.ts
          pnpm exec tsx scripts/verify-quotations.ts
          pnpm exec tsx scripts/verify-admin.ts
          pnpm exec tsx scripts/verify-admin-auth.ts
          pnpm exec tsx scripts/verify-admin-exports.ts
          pnpm exec tsx scripts/verify-contact.ts
          pnpm exec tsx scripts/verify-analytics-consent.ts
          pnpm exec tsx scripts/verify-lead-analytics.ts
          pnpm exec tsx scripts/verify-dashboard-kpis.ts
          pnpm exec tsx scripts/verify-gallery.ts
          pnpm exec tsx scripts/verify-crm.ts
          pnpm exec tsx scripts/verify-uploads.ts
          pnpm exec tsx scripts/verify-pdf-layout.ts
      - name: Build application
        run: pnpm run build
