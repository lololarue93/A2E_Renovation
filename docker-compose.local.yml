# Local image verification only; use an isolated project, port and fake credentials.
# See scripts/docker/smoke.sh. Never use this override in the production stack.
services:
  postgres:
    container_name: a2e-test-postgres
  migrate:
    image: a2e-web:local
    pull_policy: never
  media-init:
    image: a2e-web:local
    pull_policy: never
  web:
    image: a2e-web:local
    pull_policy: never
    container_name: a2e-test-web
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://127.0.0.1:3100}
