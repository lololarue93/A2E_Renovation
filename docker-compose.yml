services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.15-alpine3.23}
    container_name: a2e-postgres
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-a2e_renovation}
      POSTGRES_USER: ${POSTGRES_USER:-a2e}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - a2e_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    image: ghcr.io/lololarue93/a2e-renovation:${A2E_IMAGE_TAG:?Set A2E_IMAGE_TAG to a published sha-commit tag}
    pull_policy: always
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Portainer or .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in Portainer or .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Portainer or .env}
    command: ["sh", "-ec", "pnpm exec prisma migrate deploy && pnpm exec tsx docker/bootstrap.ts"]
    security_opt:
      - no-new-privileges:true

  media-init:
    image: ghcr.io/lololarue93/a2e-renovation:${A2E_IMAGE_TAG:?Set A2E_IMAGE_TAG to a published sha-commit tag}
    pull_policy: always
    restart: "no"
    user: "0:0"
    network_mode: none
    volumes:
      - a2e_media:/app/public/uploads
    command: ["sh", "-ec", "mkdir -p /app/public/uploads && chown -R 1000:1000 /app/public/uploads"]
    security_opt:
      - no-new-privileges:true

  web:
    image: ghcr.io/lololarue93/a2e-renovation:${A2E_IMAGE_TAG:?Set A2E_IMAGE_TAG to a published sha-commit tag}
    pull_policy: always
    container_name: a2e-web
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      media-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Portainer or .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://a2e.ddns.net}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      TZ: Europe/Paris
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in Portainer or .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Portainer or .env}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in Portainer or .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_LEADS_ENABLED: ${TELEGRAM_LEADS_ENABLED:-false}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-A2E Renovation}
      LEAD_NOTIFICATION_EMAIL: ${LEAD_NOTIFICATION_EMAIL:-julien.c@ags-a2e.com}
      SMTP_HOST: ${SMTP_HOST:-ssl0.ovh.net}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${A2E_BIND_ADDRESS:-0.0.0.0}:${A2E_PORT:-3000}:3000"
    volumes:
      - a2e_media:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health', { signal: AbortSignal.timeout(5000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Preserve these keys and the existing Portainer stack name on an upgrade.
  a2e_postgres:
  a2e_media:
