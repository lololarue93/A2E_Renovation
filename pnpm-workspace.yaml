packages:
  - '.'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true

# Same overrides as package.json for pnpm 10/11 local launchers; CI uses pnpm 9.
overrides:
  postcss: 8.5.30
  js-yaml@^4: 4.3.2
  brace-expansion@^1: 1.1.21
  brace-expansion@^2: 2.1.7
  'brace-expansion@>=4 <6': 5.0.12
  source-map-js: 1.2.2
